# doc-1's verification chain, as decision-7 splits it: this workflow no longer
# runs any step itself, it calls the tiers.
#
# Fast CI answers in a minute or two without an engine; the Real Engine Gate
# pays for the index and the graph once and runs everything that needs them.
# They are called side by side rather than chained, because the point of the
# split is how soon each answer arrives, and a public repository's runners are
# free — making the engine gate wait for the fast one would delay the slow
# answer to save minutes nobody is billed for.
#
# The Full Stress Gate is not here. It belongs to a release tag and to the
# nightly schedule (TASK-46), and release.yml calls it alongside this workflow.
name: CI

on:
  # A pull request is checked before it merges, and main is checked again after
  # it does: a merge is a commit nobody ran the chain against, and two branches
  # that were each green apart can still be red together.
  pull_request:
  push:
    branches:
      - main
  # For re-running the chain against an unchanged tree — a dependency published
  # since the last commit.
  workflow_dispatch:
  # release.yml calls this workflow, so a release runs exactly the gate a pull
  # request runs rather than a second copy of it that can drift.
  workflow_call:

permissions:
  contents: read

# A pull request that gets pushed to again while its previous run is still
# going is checked against a tree nobody will merge — the group is per PR, so
# the new commit cancels it rather than the two racing to report on the same
# check. `github.sha` is the fallback instead of `github.ref` on purpose: a
# push to main and the workflow_call from release.yml both want their own run
# to finish rather than be cancelled by whatever else lands on the same ref
# afterwards, and every commit has its own SHA where main and a release tag do
# not have their own ref.
#
# It stays in this file and out of the tiers: a called workflow evaluates its
# concurrency group in the caller's context, so a group declared down there
# would be shared by every caller of that tier and a release tag would cancel
# the run of the commit it points at.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true # verified live in PR #4

jobs:
  fast:
    uses: ./.github/workflows/ci-fast.yml

  engine:
    uses: ./.github/workflows/engine-gate.yml
