# Installs the real Zoekt and CBM and builds the fixture they are asked about.
#
# It lives here rather than in a workflow because two tiers need it — the real
# engine gate and the full stress gate — and the alternative is the same
# SHA-256 pin written down twice, where one copy gets bumped and the other
# keeps authenticating an archive nobody ships any more.
#
# Assumes Go is already set up: the Zoekt binaries are installed with `go
# install`, and the fixture is built by a script that shells out to git.
name: Prepare the real engines
description: Installs pinned Zoekt and codebase-memory-mcp, then builds the demo fixture, index and graphs.

# The pins are reported back so a job can say which engines it was green
# against without writing the versions down a second time — a copy in a
# workflow is a copy that keeps naming the old version after a bump here.
outputs:
  zoekt-version:
    description: The Zoekt pseudo-version these steps installed.
    value: ${{ steps.pins.outputs.zoekt-version }}
  cbm-version:
    description: The codebase-memory-mcp release tag these steps installed.
    value: ${{ steps.pins.outputs.cbm-version }}

runs:
  using: composite
  steps:
    # The pins live here and only here. Every step below reads one back
    # through this step's outputs rather than its own copy, which is the same
    # reason this file exists in the first place: a pin written down twice is
    # one copy that gets bumped and one that keeps authenticating the old
    # binary — the cache steps this task adds would otherwise be a second
    # place these three values could drift from the install steps that use
    # them.
    - name: Read the pins and the Go tool directory
      id: pins
      shell: bash
      env:
        # decision-3: the engines are pinned, never `latest`, so a green run
        # names the versions it was green against. Zoekt publishes no tagged
        # release, so the pin is the module pseudo-version and the Go checksum
        # database authenticates it.
        ZOEKT_VERSION: v0.0.0-20260807124253-c4d8f3537f7a
        # CBM ships release archives, so the pin is the tag plus the SHA-256
        # recorded from that release's checksums.txt. Linux gets the
        # `-portable` build: the plain linux archive dynamically links glibc.
        CBM_VERSION: v0.10.1
        CBM_SHA256: 97c6580a13d772d040e936584f3c5234586ab03f31a77354af8a763851a39a7f
      run: |
        gobin="$(go env GOPATH)/bin"
        echo "$gobin" >>"$GITHUB_PATH"
        {
          echo "gobin=$gobin"
          echo "go-version=$(go env GOVERSION)"
          echo "zoekt-version=$ZOEKT_VERSION"
          echo "cbm-version=$CBM_VERSION"
          echo "cbm-sha256=$CBM_SHA256"
        } >>"$GITHUB_OUTPUT"

    # Built from source, so the toolchain that built it is part of the key —
    # not because Zoekt itself is toolchain-sensitive the way golangci-lint
    # is, but a stale binary surviving a Go upgrade is exactly the silent
    # staleness a cache should not risk for a pin this cheap to rebuild.
    - name: Cache the pinned Zoekt binaries
      id: zoekt-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.pins.outputs.gobin }}/zoekt-git-index
          ${{ steps.pins.outputs.gobin }}/zoekt-webserver
        key: ${{ runner.os }}-zoekt-${{ steps.pins.outputs.go-version }}-${{ steps.pins.outputs.zoekt-version }}

    - name: Install the pinned Zoekt binaries
      id: zoekt
      if: steps.zoekt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ZOEKT_VERSION: ${{ steps.pins.outputs.zoekt-version }}
      run: |
        go install "github.com/sourcegraph/zoekt/cmd/zoekt-git-index@$ZOEKT_VERSION"
        go install "github.com/sourcegraph/zoekt/cmd/zoekt-webserver@$ZOEKT_VERSION"

    - name: Cache codebase-memory-mcp
      id: cbm-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/cbm
        key: ${{ runner.os }}-cbm-${{ steps.pins.outputs.cbm-version }}-${{ steps.pins.outputs.cbm-sha256 }}

    - name: Install codebase-memory-mcp
      id: cbm
      if: steps.cbm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CBM_VERSION: ${{ steps.pins.outputs.cbm-version }}
        CBM_ARCHIVE: codebase-memory-mcp-linux-amd64-portable.tar.gz
        CBM_SHA256: ${{ steps.pins.outputs.cbm-sha256 }}
      run: |
        # Downloaded and verified here rather than through the project's
        # install.sh: that script resolves `latest` and picks its own asset,
        # which is the unpinned dependency decision-3 rules out.
        url="https://github.com/DeusData/codebase-memory-mcp/releases/download/$CBM_VERSION"
        curl -fsSL -o "$RUNNER_TEMP/$CBM_ARCHIVE" "$url/$CBM_ARCHIVE"
        curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$url/checksums.txt"

        # Two checks, because they answer different questions: the archive
        # hashes to the pin recorded above, and that pin is the one the
        # release itself publishes. Verifying only against the downloaded
        # checksums.txt would trust whatever the release currently says.
        echo "$CBM_SHA256  $RUNNER_TEMP/$CBM_ARCHIVE" | sha256sum -c -
        grep -Fxq "$CBM_SHA256  $CBM_ARCHIVE" "$RUNNER_TEMP/checksums.txt"

        mkdir -p "$RUNNER_TEMP/cbm"
        tar -xzf "$RUNNER_TEMP/$CBM_ARCHIVE" -C "$RUNNER_TEMP/cbm"

    # Unconditional: the cache above only skips downloading and re-verifying
    # the archive, not putting it on PATH, and that has to happen whichever
    # step actually produced $RUNNER_TEMP/cbm.
    - name: Put codebase-memory-mcp on PATH
      shell: bash
      run: echo "$RUNNER_TEMP/cbm" >>"$GITHUB_PATH"

    # Not cached, deliberately: this builds the Zoekt shard and the CBM graphs
    # fresh every run. Reusing them across CI runs is a different, larger
    # claim than caching a binary — this repository, this Go toolchain and
    # this fixture-generation script producing the same index and graphs
    # again is exactly what the tests below are there to prove, not something
    # to assume a cache hit still holds.
    - name: Prepare the versioned demo fixture
      shell: bash
      run: |
        # doc-1 §9: CBM must be 0.10.1 or newer. The pin should already
        # guarantee it; asserting costs nothing and catches a mis-pin. Read
        # into a variable rather than piped into grep, because under pipefail
        # a grep that exits on its first match can SIGPIPE the writer.
        cbm_version=$(codebase-memory-mcp --version)
        echo "$cbm_version"
        grep -q '0\.10\.1' <<<"$cbm_version"

        # CBM has no --data-dir flag; it derives its store from this variable,
        # falling back to ~/.cache/codebase-memory-mcp. The runner's HOME is
        # already fresh every job, so this is not a correctness fix here the
        # way it is for a long-lived local checkout — it is what lets this
        # step's daemon and every later go-test step's CBM subprocess agree on
        # where the fixture's graphs live, via $GITHUB_ENV rather than a
        # second copy of the path. testdata/prepare-fixture.sh, which this
        # step calls below, falls back to the same path when it is run
        # standalone with the variable unset.
        echo "CBM_CACHE_DIR=$GITHUB_WORKSPACE/testdata/fixture/cbm-data" >>"$GITHUB_ENV"
        export CBM_CACHE_DIR="$GITHUB_WORKSPACE/testdata/fixture/cbm-data"

        # Every CBM `cli` call otherwise cold-starts a throwaway daemon.
        # Measured on the adapters/cbm package alone: 147s without a daemon,
        # 52s with one already running.
        codebase-memory-mcp daemon start

        # Builds the demo repository (it runs gen-versioned-demo-repo.sh
        # itself), the Zoekt index and the two CBM graphs. Without it the
        # integration tests skip instead of running, which is what the test
        # steps refuse to accept.
        testdata/prepare-fixture.sh
